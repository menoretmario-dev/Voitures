<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exposition de Véhicules | Bonnes Affaires</title>
<style>
:root {
  --bg:#0b1220;--surface:#0f172a;--card:#111827;
  --muted:#94a3b8;--text:#e5e7eb;--primary:#22c55e;
  --primary-600:#16a34a;--whatsapp:#25D366;--accent:#38bdf8;
}
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
background:radial-gradient(1200px 600px at 10% -10%,#0b1220 40%,#020617 70%),var(--bg);
color:var(--text);line-height:1.6;}
header{position:sticky;top:0;z-index:50;background:rgba(2,6,23,0.85);
backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,163,184,.1);padding:1rem;}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;
gap:1rem;justify-content:space-between;flex-wrap:wrap;}
.brand-left{display:flex;align-items:center;gap:1rem;min-width:260px;}
.brand-left img{height:90px;border-radius:10px;}
.header-info h1{font-size:1.4rem;margin:0;}
.header-info p{margin:0;color:var(--muted);}
@media(max-width:600px){.brand-left img{height:70px;}}
.container{max-width:1200px;margin:1.6rem auto;padding:0 1rem;}
.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:12px;margin:1.2rem 0 1rem 0;}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr;}}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:0.85rem;color:var(--muted);}
input,select{width:100%;padding:0.85rem 0.9rem;border-radius:12px;border:1px solid rgba(148,163,184,.15);
background:rgba(15,23,42,0.6);color:var(--text);outline:none;font-size:0.95rem;}
input:focus,select:focus{border-color:rgba(56,189,248,0.7);box-shadow:0 0 0 3px rgba(56,189,248,0.15);}
.actions{display:flex;gap:10px;align-items:flex-end;}
.btn-small{padding:0.85rem 1rem;border-radius:12px;border:1px solid rgba(148,163,184,.15);
background:rgba(17,24,39,.6);color:var(--text);font-weight:900;cursor:pointer;
transition:opacity .2s, transform .1s;user-select:none;width:100%;}
.btn-small:hover{opacity:.92;}.btn-small:active{transform:scale(.98);}
.stats{margin:0.8rem 0 1.8rem 0;color:var(--muted);font-size:0.9rem;}
.vehicles{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2rem;}
.card{background:var(--card);border:1px solid rgba(148,163,184,.1);border-radius:16px;overflow:hidden;transition:all 0.25s ease;}
.card:hover{transform:translateY(-5px);border-color:var(--accent);}
.carousel{position:relative;height:240px;background:#000;cursor:zoom-in;}
.carousel img{width:100%;height:100%;object-fit:cover;display:none;}
.carousel img.active{display:block;}
.carousel button{position:absolute;top:50%;transform:translateY(-50%);
background:rgba(0,0,0,0.55);color:white;border:none;width:38px;height:38px;border-radius:50%;
cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.carousel .prev{left:10px;}.carousel .next{right:10px;}
.card-content{padding:1.3rem;}
.title-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.title-row h3{margin:0;font-size:1.1rem;line-height:1.3;}
.badge{padding:0.25rem 0.6rem;border-radius:999px;font-size:0.75rem;font-weight:900;white-space:nowrap;
background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.25);color:#7dd3fc;}
.price{color:var(--primary);font-size:1.35rem;font-weight:900;margin:0.5rem 0;}
.details{color:var(--muted);font-size:0.92rem;margin-bottom:1.1rem;}
.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:0.8rem;border-radius:10px;text-decoration:none;font-weight:900;font-size:0.92rem;transition:opacity 0.2s, transform 0.1s;user-select:none;}
.btn:active{transform:scale(0.98);}.btn-call{background:linear-gradient(to bottom,var(--primary),var(--primary-600));color:#052e16;}.btn-wa{background:var(--whatsapp);color:white;}
.btn:hover{opacity:.92;}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1000;justify-content:center;align-items:center;}
.lightbox img{max-width:95%;max-height:85vh;border-radius:10px;user-select:none;}
.close{position:absolute;top:18px;right:25px;font-size:2.5rem;color:white;cursor:pointer;z-index:1010;user-select:none;}
.lb-nav{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;}
.lb-nav button{pointer-events:auto;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.35);color:white;width:52px;height:52px;border-radius:50%;cursor:pointer;font-size:1.4rem;}
.empty{padding:2rem;text-align:center;color:var(--muted);border:1px dashed rgba(148,163,184,.25);border-radius:16px;background:rgba(17,24,39,.4);}
.loading{padding:2rem;text-align:center;color:var(--muted);border:1px solid rgba(148,163,184,.12);border-radius:16px;background:rgba(17,24,39,.25);}
footer{text-align:center;padding:3rem;color:var(--muted);font-size:0.85rem;}
</style>
</head>

<body>
<header>
<div class="header-inner">
  <div class="brand-left">
    <img src="logo.png" alt="Logo">
    <div class="header-info">
      <h1>Exposition de Véhicules</h1>
      <p>Ventes & Occasions</p>
    </div>
  </div>
</div>
</header>

<main class="container">
<div class="filters">
<div class="field"><label for="search">🔎 Recherche (marque / modèle)</label><input id="search" type="text" placeholder="Ex: Renault Clio, Peugeot 208..." autocomplete="off" /></div>
<div class="field"><label for="fuel">⛽ Carburant</label><select id="fuel"><option value="">Tous</option><option value="Essence">Essence</option><option value="Diesel">Diesel</option><option value="Hybride">Hybride</option><option value="Électrique">Électrique</option></select></div>
<div class="field"><label for="priceMin">💶 Prix min</label><input id="priceMin" type="number" placeholder="Ex: 5000" min="0" /></div>
<div class="field"><label for="priceMax">💶 Prix max</label><input id="priceMax" type="number" placeholder="Ex: 15000" min="0" /></div>
<div class="field"><label for="sort">↕️ Trier</label><select id="sort"><option value="recent">Année (récent)</option><option value="priceAsc">Prix (croissant)</option><option value="priceDesc">Prix (décroissant)</option><option value="kmAsc">Km (faible)</option></select></div>
<div class="field"><label for="yearMin">📅 Année min</label><input id="yearMin" type="number" placeholder="Ex: 2012" min="1980" /></div>
<div class="field"><label for="yearMax">📅 Année max</label><input id="yearMax" type="number" placeholder="Ex: 2022" min="1980" /></div>
<div class="field"><label for="kmMax">🧾 Km max</label><input id="kmMax" type="number" placeholder="Ex: 150000" min="0" /></div>
<div class="actions"><button class="btn-small" id="reset">♻️ Réinitialiser</button></div>
</div>

<div class="stats" id="stats"></div>
<div id="loading" class="loading">Chargement des véhicules…</div>
<div class="vehicles" id="vehicles"></div>
<div class="empty" id="empty" style="display:none;">Aucun véhicule ne correspond à votre recherche.</div>
</main>

<div id="lightbox" class="lightbox">
<span class="close" id="lb-close">&times;</span>
<div class="lb-nav"><button id="lb-prev">‹</button><button id="lb-next">›</button></div>
<img id="lightbox-img" src="" alt="">
</div>

<footer>© 2025 – Exposition de Véhicules | Contact direct : 06 58 16 19 13</footer>

<script>
const PHONE="+33658161913";
const WHATSAPP="33658161913";
const API_URL="https://script.google.com/macros/s/AKfycbyB5mICWusKFpxbTp4bsPMJkLxckGgA21TxqLdATz_kHxN3CZ24qweN6-T9UMgNZ4XrKw/exec";

let cars=[];

const formatPrice=n=>new Intl.NumberFormat("fr-FR").format(n)+" €";
const formatKm=n=>new Intl.NumberFormat("fr-FR").format(n)+" km";
const normalize=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

const vehiclesEl=document.getElementById("vehicles");
const statsEl=document.getElementById("stats");
const emptyEl=document.getElementById("empty");
const loadingEl=document.getElementById("loading");

const searchEl=document.getElementById("search");
const fuelEl=document.getElementById("fuel");
const priceMinEl=document.getElementById("priceMin");
const priceMaxEl=document.getElementById("priceMax");
const yearMinEl=document.getElementById("yearMin");
const yearMaxEl=document.getElementById("yearMax");
const kmMaxEl=document.getElementById("kmMax");
const sortEl=document.getElementById("sort");
const resetEl=document.getElementById("reset");

// ===== LOAD DATA =====
async function loadCars(){
  try{
    loadingEl.style.display="block";
    vehiclesEl.innerHTML="";
    emptyEl.style.display="none";
    const res=await fetch(API_URL);
    cars=await res.json();
    cars=cars.map(c=>({...c,images:c.images&&c.images.length?c.images:["https://via.placeholder.com/800x500/1e293b/fff?text=Photo"]}));
    applyFilters();
  }catch(err){
    console.error("Erreur API :",err);
    loadingEl.textContent="Erreur : impossible de charger les véhicules.";
  }finally{
    loadingEl.style.display="none";
  }
}

// ===== FILTER + SORT =====
function getFilteredCars(){
  const q=normalize(searchEl.value);
  const fuel=fuelEl.value;
  const priceMin=Number(priceMinEl.value||0);
  const priceMax=Number(priceMaxEl.value||99999999);
  const yearMin=Number(yearMinEl.value||0);
  const yearMax=Number(yearMaxEl.value||9999);
  const kmMax=Number(kmMaxEl.value||99999999);

  let filtered=cars.filter(c=>{
    const text=normalize(`${c.marque} ${c.modele}`);
    return text.includes(q) && (!fuel||c.carburant===fuel) && c.prix>=priceMin && c.prix<=priceMax && c.annee>=yearMin && c.annee<=yearMax && c.km<=kmMax;
  });

  switch(sortEl.value){
    case"recent": filtered.sort((a,b)=>b.annee-a.annee); break;
    case"priceAsc": filtered.sort((a,b)=>a.prix-b.prix); break;
    case"priceDesc": filtered.sort((a,b)=>b.prix-a.prix); break;
    case"kmAsc": filtered.sort((a,b)=>a.km-b.km); break;
  }

  return filtered;
}
function applyFilters(){ renderCars(getFilteredCars()); }

// ===== RENDER =====
function renderCars(list){
  vehiclesEl.innerHTML="";
  statsEl.textContent=`${list.length} véhicule(s) affiché(s) sur ${cars.length}`;
  if(list.length===0){ emptyEl.style.display="block"; return; } else { emptyEl.style.display="none"; }

  list.forEach(car=>{
    const badgeHtml=car.badge?`<span class="badge">${car.badge}</span>`:"";
    const imagesHtml=car.images.map((src,i)=>`<img src="${src}" class="${i===0?'active':''}" alt="${car.marque} ${car.modele}">`).join("");
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="carousel">
        ${imagesHtml}
        <button class="prev" aria-label="Image précédente">‹</button>
        <button class="next" aria-label="Image suivante">›</button>
      </div>
      <div class="card-content">
        <div class="title-row"><h3>${car.marque} ${car.modele}</h3>${badgeHtml}</div>
        <div class="price">${formatPrice(car.prix)}</div>
        <div class="details">${car.annee} • ${car.carburant} • ${formatKm(car.km)}</div>
        <div class="contact-actions">
          <a href="tel:${PHONE}" class="btn btn-call">📞 Appeler</a>
          <a href="https://wa.me/${WHATSAPP}" class="btn btn-wa" target="_blank">💬 WhatsApp</a>
        </div>
      </div>
    `;
    vehiclesEl.appendChild(card);
  });

  setupCarouselsAndLightbox();
}

// ===== CAROUSEL + LIGHTBOX =====
let currentSet=[],currentIndex=0;
const lb=document.getElementById("lightbox");
const lbImg=document.getElementById("lightbox-img");

function setupCarouselsAndLightbox(){
  document.querySelectorAll(".carousel").forEach(carousel=>{
    const imgs=carousel.querySelectorAll("img");
    const next=carousel.querySelector(".next");
    const prev=carousel.querySelector(".prev");
    let idx=0;
    if(imgs.length<=1){next.style.display="none";prev.style.display="none";}
    const updateImg=newIdx=>{imgs[idx].classList.remove("active");idx=newIdx;imgs[idx].classList.add("active");};
    next.onclick=e=>{e.stopPropagation();updateImg((idx+1)%imgs.length);};
    prev.onclick=e=>{e.stopPropagation();updateImg((idx-1+imgs.length)%imgs.length);};
    imgs.forEach((img,i)=>{img.onclick=()=>{currentSet=Array.from(imgs).map(x=>x.src);currentIndex=i;lbImg.src=currentSet[currentIndex];lb.style.display="flex";}});
  });
}

function nextSlide(){if(!currentSet.length)return;currentIndex=(currentIndex+1)%currentSet.length;lbImg.src=currentSet[currentIndex];}
function prevSlide(){if(!currentSet.length)return;currentIndex=(currentIndex-1+currentSet.length)%currentSet.length;lbImg.src=currentSet[currentIndex];}

document.getElementById("lb-next").onclick=e=>{e.stopPropagation();nextSlide();};
document.getElementById("lb-prev").onclick=e=>{e.stopPropagation();prevSlide();};
document.getElementById("lb-close").onclick=()=>lb.style.display="none";
lb.onclick=e=>{if(e.target===lb)lb.style.display="none";};
let touchStartX=0;
lb.addEventListener("touchstart",e=>touchStartX=e.changedTouches[0].screenX);
lb.addEventListener("touchend",e=>{let touchEndX=e.changedTouches[0].screenX;if(touchStartX-touchEndX>50)nextSlide();if(touchEndX-touchStartX>50)prevSlide();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")lb.style.display="none";if(e.key==="ArrowRight")nextSlide();if(e.key==="ArrowLeft")prevSlide();});

// ===== EVENTS =====
[searchEl,fuelEl,priceMinEl,priceMaxEl,yearMinEl,yearMaxEl,kmMaxEl,sortEl].forEach(el=>el.addEventListener("input",applyFilters));
resetEl.addEventListener("click",()=>{searchEl.value="";fuelEl.value="";priceMinEl.value="";priceMaxEl.value="";yearMinEl.value="";yearMaxEl.value="";kmMaxEl.value="";sortEl.value="recent";applyFilters();});

// ===== START =====
loadCars();
</script>

</body>
</html>
